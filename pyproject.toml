[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attentionguard"
version = "0.1.0"
description = "Worker-alertness monitoring for barcode scanning workstations (warn-and-log)."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "cryptography",
    "argon2-cffi",
    "httpx",
    "tzdata",  # IANA zones for zoneinfo on Windows, which has no system database
]

[project.optional-dependencies]
server = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2",
    "alembic",
    "psycopg[binary]",
    "jinja2",
    "python-multipart",
    "pyotp",
    "pyjwt",
    "apscheduler",
    "openpyxl",
    "weasyprint",
]
workstation = [
    "pyside6",
    "opencv-python",
    "mediapipe",
    "numpy",
    "httpx",  # sync client (PLAN 2.9); also a base dependency, listed so the extra is explicit
    "pywin32; sys_platform == 'win32'",
    "tzdata; sys_platform == 'win32'",
]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-qt",
    "ruff",
    "mypy",
    "pip-audit",
    "hypothesis",
    "pyyaml",  # deploy file tests
]

[tool.setuptools.packages.find]
where = ["shared", "workstation", "server"]
include = ["ag_shared*", "ag_workstation*", "ag_server*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]
"ag_shared.i18n" = ["catalogs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov --cov-report=term-missing"
markers = [
    "video: needs the labeled video set (AG_TEST_VIDEOS)",
    "slow: load, soak and chaos tests",
    "windows: needs a real Windows service or DPAPI",
]

[tool.coverage.run]
source = ["ag_shared", "ag_workstation", "ag_server"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["server", "workstation", "shared", "tests"]
mypy_path = ["shared", "workstation", "server"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["yaml", "cv2", "cv2.*", "mediapipe", "mediapipe.*", "win32api", "win32crypt", "win32service", "win32serviceutil", "win32event", "servicemanager", "pywintypes"]
ignore_missing_imports = true
