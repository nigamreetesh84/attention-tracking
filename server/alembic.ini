# Alembic configuration for the AttentionGuard server.
#   alembic -c server/alembic.ini upgrade head
# The database URL is not stored here: env.py reads it from the server settings
# (AG_DATABASE_URL or AG_DATABASE_URL_FILE), the same way the app does.

[alembic]
script_location = %(here)s/ag_server/migrations
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
