{% extends "base.html" %}
{% block title %}{{ t("console.auth.login_title") }}{% endblock %}
{% block content %}
<h1>{{ t("console.auth.login_title") }}</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/auth/login" autocomplete="on">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>{{ t("console.auth.username") }}
    <input name="username" autocomplete="username" required maxlength="128" autofocus>
  </label>
  <label>{{ t("console.auth.password") }}
    <input name="password" type="password" autocomplete="current-password" required maxlength="256">
  </label>
  <button type="submit">{{ t("console.auth.login_submit") }}</button>
</form>
{% endblock %}
